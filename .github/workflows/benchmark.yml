name: Benchmark

on:
  # pull_request:
  push:
  schedule:
    - cron: '54 4,10,16,22 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  benchmark-x86-64-linux-gcc:
    uses: ./.github/workflows/benchmark_base.yml
    with:
      extra_packages:
      cmake_flags: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      name: x86_64-linux-gcc
    permissions:
      contents: read
  benchmark-x86-64-linux-gcc-lto:
    uses: ./.github/workflows/benchmark_base.yml
    with:
      extra_packages:
      cmake_flags: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_FLAGS=-flto -DCMAKE_CXX_FLAGS=-flto -DCMAKE_EXE_LINKER_FLAGS=-flto -DCMAKE_AR=gcc-ar -DCMAKE_RANLIB=gcc-ranlib
      name: x86_64-linux-gcc-lto
    permissions:
      contents: read
  benchmark-x86-64-linux-clang:
    uses: ./.github/workflows/benchmark_base.yml
    with:
      extra_packages: clang-20
      cmake_flags: -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
      name: x86_64-linux-clang
    permissions:
      contents: read
  benchmark-x86-64-linux-clang-lto:
    uses: ./.github/workflows/benchmark_base.yml
    with:
      extra_packages: clang-20
      cmake_flags: -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_C_FLAGS=-flto -DCMAKE_CXX_FLAGS=-flto -DCMAKE_EXE_LINKER_FLAGS=-flto
      name: x86_64-linux-clang-lto
    permissions:
      contents: read
  upload-results:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - benchmark-x86-64-linux-gcc
      - benchmark-x86-64-linux-gcc-lto
      - benchmark-x86-64-linux-clang
      - benchmark-x86-64-linux-clang-lto
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get -y install nodejs
      - name: Clean Up
        run: |
          rm -f bench-*
      - name: Download Results
        uses: actions/download-artifact@v8
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add Results
        run: |
          cat bench-*/*.patch | git apply --reject || true
      - name: Commit and Push
        run: |
          git commit -a -m"Update benchmark results for commit ${GITHUB_SHA}."
          git push
      - name: Run Anomaly Detection
        run: |
          set -ex
          {
            cd dev/bench
            node -e 'window = {}; require("./x86_64-linux-gcc/data.js"); require("./anomaly.js");'
            node -e 'window = {}; require("./x86_64-linux-clang/data.js"); require("./anomaly.js");'
          } | {
            ! grep .
          }
